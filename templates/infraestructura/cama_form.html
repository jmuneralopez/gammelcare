{% extends 'infraestructura/_form_base.html' %}
{% block icono %}hospital{% endblock %}
{% block extra_label %}{% if field.name == 'habitacion' %}<button type="button" class="btn btn-sm btn-link p-0 mb-1" data-bs-toggle="modal" data-bs-target="#modalAlta">Agregar habitación</button>{% endif %}{% endblock %}
{% block modal %}
<div class="modal fade alta-rapida" id="modalAlta" tabindex="-1" data-url="{% url 'habitacion_crear_rapido' %}" data-select="#id_habitacion">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title fw-bold">Agregar habitación</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="errores text-danger small mb-2"></div>
      <label class="form-label small fw-semibold">Departamento</label>
      <select name="departamento" class="form-select mb-2">{% for d in departamentos %}<option value="{{ d.pk }}">{{ d.nombre }}</option>{% empty %}<option value="">Primero cree un departamento</option>{% endfor %}</select>
      <label class="form-label small fw-semibold">Número de la habitación</label><input type="text" name="numero" class="form-control" placeholder="Ej.: 105">
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-gc guardar-alta">Agregar habitación</button></div>
  </div></div>
</div>
{% endblock %}

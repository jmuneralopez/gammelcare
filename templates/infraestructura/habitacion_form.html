{% extends 'infraestructura/_form_base.html' %}
{% block icono %}door-open{% endblock %}
{% block extra_label %}{% if field.name == 'departamento' %}<button type="button" class="btn btn-sm btn-link p-0 mb-1" data-bs-toggle="modal" data-bs-target="#modalAlta">Agregar departamento</button>{% endif %}{% endblock %}
{% block modal %}
<div class="modal fade alta-rapida" id="modalAlta" tabindex="-1" data-url="{% url 'departamento_crear_rapido' %}" data-select="#id_departamento">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title fw-bold">Agregar departamento</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="errores text-danger small mb-2"></div>
      <label class="form-label small fw-semibold">Nombre</label><input type="text" name="nombre" class="form-control mb-2" placeholder="Ej.: Pabellón B">
      <label class="form-label small fw-semibold">Descripción (opcional)</label><input type="text" name="descripcion" class="form-control">
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-gc guardar-alta">Agregar departamento</button></div>
  </div></div>
</div>
{% endblock %}

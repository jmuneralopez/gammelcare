{% if cita.requiere_ayuno %}<span class="badge text-bg-warning me-1"><i class="bi bi-cup-straw me-1"></i>Ayuno</span>{% endif %}

<span class="badge text-bg-light border"><i class="bi bi-person-walking me-1"></i>{{ cita.acompanante|default:"Acompañante por definir" }}</span>

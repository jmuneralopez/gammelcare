<ul class="list-group list-group-flush">
  {% for a in archivos %}
  <li class="list-group-item px-0 d-flex justify-content-between align-items-start gap-2">
    <div>
      <i class="bi {% if a.es_imagen %}bi-file-earmark-image{% else %}bi-file-earmark-pdf{% endif %} me-1"></i>
      <a href="{% url 'archivo_ver' a.pk %}" target="_blank" rel="noopener">{{ a.nombre_original }}</a>
      <div class="text-muted small">
        {{ a.fecha_subida|date:"d/m/Y H:i" }} · {{ a.subido_por.get_full_name|default:a.subido_por.username }} · {{ a.tamano_bytes|filesizeformat }}
        {% if a.motivo %}<br><span class="fst-italic">Adenda: {{ a.motivo }}</span>{% endif %}
      </div>
    </div>
    <a href="{% url 'archivo_ver' a.pk %}?descargar=1" class="btn btn-sm btn-outline-secondary" title="Descargar"><i class="bi bi-download"></i></a>
  </li>
  {% endfor %}
</ul>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GammelCare — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gc-navy:        #0B3D62;
      --gc-navy-2:      #124A76;
      --gc-blue:        #1768AC;
      --gc-sage:        #4F9E86;
      --gc-sage-dark:   #3E8571;
      --gc-sage-light:  #E3F2EC;
      --gc-bg:          #F6FAF9;
      --gc-border:      #D8E8E3;
    }
    body {
      background: linear-gradient(150deg, var(--gc-navy) 0%, var(--gc-navy-2) 55%, var(--gc-sage-dark) 140%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      background: #fff;
      border: 1px solid var(--gc-border);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(11,61,98,0.30);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      color: var(--gc-navy);
      font-family: 'Manrope', 'Inter', Arial, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .login-logo i { color: var(--gc-sage); }
    .login-subtitle {
      color: #5B7069;
      font-size: 0.9rem;
      margin-bottom: 0.6rem;
    }
    .login-pulse { display: block; margin: 0 auto 1.6rem; }
    .form-control:focus {
      border-color: var(--gc-blue);
      box-shadow: 0 0 0 0.2rem rgba(23,104,172,0.18);
    }
    .btn-login {
      background-color: var(--gc-navy);
      color: #fff;
      border: none;
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border-radius: 10px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover {
      background-color: var(--gc-blue);
      color: #fff;
      box-shadow: 0 6px 16px rgba(11,61,98,0.3);
    }
    .divider {
      border-top: 1px solid var(--gc-border);
      margin: 1.5rem 0 1rem;
    }
    .footer-text {
      font-size: 0.78rem;
      color: #94A3B8;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Logo -->
  <div class="text-center mb-1">
    <div class="login-logo">
      <i class="bi bi-heart-pulse"></i> GammelCare
    </div>
    <div class="login-subtitle">Sistema de Gestión para Hogares Geriátricos</div>
    <svg class="login-pulse" width="120" height="24" viewBox="0 0 120 24" fill="none">
      <path d="M0 12 H38 L45 3 L54 21 L61 8 L67 12 H120" stroke="#4F9E86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Errores -->
  {% if error %}
  <div class="alert alert-danger py-2 px-3" style="font-size:0.88rem;">
    <i class="bi bi-exclamation-triangle-fill me-1"></i>
    {{ mensaje_error|default:"Usuario o contraseña incorrectos. Intente nuevamente." }}
  </div>
{% endif %}

  <!-- Formulario -->
  <form method="post" autocomplete="off">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:0.9rem;">
        <i class="bi bi-person me-1"></i>Usuario
      </label>
      <input
        type="text"
        name="username"
        class="form-control"
        placeholder="Ingrese su usuario"
        autofocus
        required
      >
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:0.9rem;">
        <i class="bi bi-lock me-1"></i>Contraseña
      </label>
      <div class="input-group">
        <input
          type="password"
          name="password"
          id="passwordField"
          class="form-control"
          placeholder="Ingrese su contraseña"
          required
        >
        <button
          class="btn btn-outline-secondary"
          type="button"
          onclick="togglePassword()"
          tabindex="-1"
        >
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
    </button>
  </form>

  <div class="divider"></div>
  <div class="footer-text">
    Acceso restringido a personal autorizado
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePassword() {
    const field = document.getElementById('passwordField');
    const icon  = document.getElementById('eyeIcon');
    if (field.type === 'password') {
      field.type = 'text';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
      field.type = 'password';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
  }
</script>
</body>
</html>

{% extends 'base.html' %}
{% block title %}GammelCare — Configuración{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3" style="color:#1F4E79;"><i class="bi bi-gear me-2"></i>Configuración</h4>
<p class="text-muted">Lo que puede ajustar en el hogar según su rol.</p>
<div class="row g-3">
  {% for o in opciones %}
  <div class="col-md-6 col-xl-4">
    <a href="{{ o.url }}" class="card card-gc h-100 text-decoration-none"><div class="card-body">
      <div class="fw-bold" style="color:#1F4E79;"><i class="bi {{ o.icono }} me-2"></i>{{ o.titulo }}</div>
      <div class="small text-muted mt-1">{{ o.descripcion }}</div>
    </div></a>
  </div>
  {% endfor %}
</div>
{% endblock %}
